<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad Select</title>

    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <script src="js/bootstrap.bundle.js"></script>
    <script src="js/jquery-3.6.0.js"></script>
    <script src="js/main.js"></script>
</head>

<body>

    <div class="container">

        <div class="actividad">

            <h2 class="text-center mb-4">
                Selecciona la respuesta correcta
            </h2>

            <div class="row text-center">

                <div class="col-md-4 mb-4">

                    <img src="img/imagen 1.png"
                        class="imagen">

                    <select class="form-select mt-3 respuesta" data-correcta="Vaper">

                        <option value="">Seleccione</option>
                        <option>Esfero</option>
                        <option>USB</option>
                        <option>Vaper</option>

                    </select>

                </div>

      
                <div class="col-md-4 mb-4">

                    <img src="img/imagen 2 png.webp"
                        class="imagen">

                    <select class="form-select mt-3 respuesta" data-correcta="Pulmón">

                        <option value="">Seleccione</option>
                        <option>Pulmón</option>
                        <option>Corazón</option>
                        <option>Hígado</option>

                    </select>

                </div>

             
                <div class="col-md-4 mb-4">

                    <img src="img/imagen 3 png.jpg"
                        class="imagen">

                    <select class="form-select mt-3 respuesta" data-correcta="Salud">

                        <option value="">Seleccione</option>
                        <option>Salud</option>
                        <option>Diversión</option>
                        <option>Llorar</option>

                    </select>

                </div>

            </div>

            <div class="text-center mt-4">

                <button class="btn btn-success" onclick="verificar()">
                    Verificar
                </button>

                <button class="btn btn-primary" onclick="reiniciar()">
                    Reiniciar
                </button>

            </div>

            <div id="resultado" class="resultado">

            </div>

        </div>

    </div>


    <audio id="audioBien" src="audios/bien.mp3"></audio>
    <audio id="audioMal" src="audios/twin.mp3"></audio>
    <audio id="audioAplausos" src="audios/aplausos.mp3"></audio>

  
 

</body>

</html>
